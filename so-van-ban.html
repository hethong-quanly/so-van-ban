<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ văn bản đến tố tụng</title>
<style>
  :root { --ink:#1e5a8a; --gold:#ffe566; --desk:#e4f2fb; --paper:#f7fbfe; --line:#c5d8e8; --muted:#4e6a84; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--desk); color:#16324d; font:15px/1.45 "Be Vietnam Pro","Segoe UI",sans-serif; }
  header { background:var(--ink); color:#fff; padding:14px 18px 12px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:22px; font-weight:650; }
  header p { margin:2px 0 0; color:#d7ebf8; font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 18px; background:#fff; border-bottom:1px solid var(--line); }
  button, select, input { font:inherit; }
  button { min-height:40px; border:0; border-radius:8px; padding:8px 12px; background:var(--ink); color:#fff; font-weight:650; cursor:pointer; }
  button.line { background:#fff; color:var(--ink); border:1px solid var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { min-height:40px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; color:#16324d; }
  .note { padding:0 18px 10px; color:var(--muted); font-size:13px; background:#fff; }
  main { padding:14px 18px 40px; }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  th { background:#d7ebf8; position:sticky; top:118px; }
  tr:hover td { background:#f3f9fd; }
  .pager { display:flex; gap:8px; align-items:center; margin:12px 0; flex-wrap:wrap; }
  dialog { border:0; border-radius:12px; padding:0; width:min(720px, 96vw); }
  dialog form { padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  dialog h2 { grid-column:1 / -1; margin:0; }
  dialog label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  dialog .full { grid-column:1 / -1; }
  dialog menu { grid-column:1 / -1; display:flex; gap:8px; justify-content:flex-end; margin:0; padding:0; }
  @media (max-width:800px) { th { top:0; } dialog form, .hide-sm { display:block; } table { display:block; overflow:auto; } }
</style>
</head>
<body>
<header>
  <h1>Sổ văn bản đến tố tụng</h1>
  <p id="sub">Năm 2026 · chưa nối ổ D:\Sovanban</p>
</header>
<div class="bar">
  <button id="btnDisk" type="button">Nối D:\Sovanban</button>
  <button id="btnExcel" class="line" type="button">Tải Excel cập nhật</button>
  <input id="outDay" type="date" aria-label="Chọn ngày xuất">
  <button id="btnOutDay" class="line" type="button">Xuất ngày này</button>
  <button id="btnOutPrev" class="line" type="button">Xuất ngày trước</button>
  <button id="btnOut" class="line" type="button">Xuất tất cả</button>
  <button id="btnAdd" class="line" type="button">Thêm văn bản</button>
  <input id="q" placeholder="Tìm số đến, cơ quan, trích yếu…" style="min-width:220px;flex:1">
  <input id="day" type="date" aria-label="Lọc ngày nhận">
</div>
<p class="note" id="note">Lần đầu bấm Nối D:\Sovanban và chọn đúng thư mục đó. Máy còn bật thì sổ tự ghi liên tục. Tắt máy thì ngắt.</p>
<main>
  <div class="pager">
    <button id="prev" class="line" type="button">Trang trước</button>
    <label>Trang <select id="page"></select></label>
    <button id="next" class="line" type="button">Trang sau</button>
    <span id="count"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Ngày nhận</th><th>Số đến</th><th>Nơi gửi</th><th>Văn bản đến</th><th>Ngày VB</th><th>Loại</th><th>Trích yếu</th><th>Nhận</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Thêm văn bản</h2>
    <label>Ngày nhận<input name="ngayNhan" type="date" required></label>
    <label>Số đến<input name="soDen" required></label>
    <label>Nơi gửi<input name="noiGui"></label>
    <label>Văn bản đến<input name="soKyHieu"></label>
    <label>Ngày văn bản<input name="ngayBanHanh"></label>
    <label>Loại<input name="loai" placeholder="BA, QĐ, TBTL, Lệnh…"></label>
    <label class="full">Trích yếu<input name="trichYeu" placeholder="Đương sự hoặc bị can"></label>
    <label>Người nhận<input name="nguoiNhan"></label>
    <label>Ký nhận<input name="kyNhan"></label>
    <label class="full">Ghi chú<input name="ghiChu"></label>
    <menu>
      <button class="line" value="cancel" type="submit">Đóng</button>
      <button value="ok" type="submit">Ghi sổ</button>
    </menu>
  </form>
</dialog>
<input id="file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

const DB = "so-van-ban-html";
let records = [];
let year = SEED.year || 2026;
let page = 1;

let saveTimer = 0;

const $ = (id) => document.getElementById(id);

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      if (!db.objectStoreNames.contains("handles")) db.createObjectStore("handles");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idb(store, mode, fn) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const out = fn(tx.objectStore(store));
    tx.oncomplete = () => { db.close(); resolve(out && out.result !== undefined ? out.result : out); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}
function fold(value) {
  return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
}
function canonLoai(value) {
  const raw = String(value || "").replace(/\s+/g, " ").trim();
  const key = fold(raw).replace(/[^a-z0-9]/g, "");
  const exact = { qd:"QĐ", quyetdinh:"QĐ", ba:"BA", banan:"BA", tb:"TB", thongbao:"TB", tbtl:"TBTL", tbkc:"TBKC", qdpc:"QĐPC", qdpctp:"QĐPCTP", qdtg:"QĐTG", lenh:"Lệnh", cv:"CV", congvan:"CV", bc:"BC", gtt:"GTT", giaytt:"GTT" };
  return exact[key] || raw;
}
function soDenKey(value) {
  const m = String(value || "").match(/^(\d+)(.*)$/);
  return m ? [Number(m[1]), m[2].toLowerCase()] : [Number.MAX_SAFE_INTEGER, String(value || "").toLowerCase()];
}
function compareRows(a, b) {
  const da = a.ngayNhan || "";
  const db = b.ngayNhan || "";
  if (da !== db) return db.localeCompare(da);
  const [an, as] = soDenKey(a.soDen);
  const [bn, bs] = soDenKey(b.soDen);
  if (an !== bn) return bn - an;
  return bs.localeCompare(as);
}
function showDate(iso) {
  if (!iso) return "";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);
}
function toIso(value) {
  if (value == null || value === "") return "";
  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    const y = value.getFullYear();
    const m = String(value.getMonth() + 1).padStart(2, "0");
    const d = String(value.getDate()).padStart(2, "0");
    return y >= 1990 && y <= 2100 ? `${y}-${m}-${d}` : "";
  }
  const text = String(value).trim();
  let m = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = text.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
  if (!m) return text;
  let y = Number(m[3]);
  if (y < 100) y += 2000;
  if (y < 1990 || y > 2100) return text;
  return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
}
function fromSeed(rows) {
  return rows.map((row) => ({
    ngayNhan: row[0] || "",
    soDen: String(row[1] || "").trim(),
    noiGui: row[2] || "",
    soKyHieu: String(row[3] || ""),
    ngayBanHanh: row[4] || "",
    loai: canonLoai(row[5] || ""),
    trichYeu: row[6] || "",
    nguoiNhan: row[7] || "",
    kyNhan: row[8] || "",
    ghiChu: row[9] || "",
  })).filter((row) => row.soDen);
}
function filtered() {
  const q = fold($("q").value.trim());
  const day = $("day").value;
  return records.filter((row) => {
    if (day && row.ngayNhan !== day) return false;
    if (!q) return true;
    return fold([row.soDen, row.noiGui, row.soKyHieu, row.loai, row.trichYeu, row.nguoiNhan].join(" ")).includes(q);
  }).sort(compareRows);
}
function render() {
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (page > pages) page = pages;
  const pageSel = $("page");
  pageSel.innerHTML = "";
  for (let i = 1; i <= pages; i++) {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `${i} / ${pages}`;
    if (i === page) opt.selected = true;
    pageSel.appendChild(opt);
  }
  const slice = list.slice((page - 1) * PAGE, page * PAGE);
  $("rows").innerHTML = slice.map((row) => `<tr>
    <td>${showDate(row.ngayNhan)}</td>
    <td><b>${esc(row.soDen)}</b></td>
    <td>${esc(row.noiGui)}</td>
    <td>${esc(row.soKyHieu)}</td>
    <td>${esc(showDate(row.ngayBanHanh))}</td>
    <td>${esc(row.loai)}</td>
    <td>${esc(row.trichYeu)}</td>
    <td>${esc(row.nguoiNhan)}</td>
    <td><button class="line" type="button" data-edit="${esc(row.soDen)}">Sửa</button></td>
  </tr>`).join("");
  $("count").textContent = `${list.length} văn bản · trang ${page}/${pages}`;
  $("sub").textContent = `Năm ${year} · ${records.length} văn bản · ${folderReady ? "đang nối " + DISK : "chưa nối " + DISK}`;
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => {
    if (ch === "&") return "&" + "amp;";
    if (ch === "<") return "&" + "lt;";
    if (ch === ">") return "&" + "gt;";
    if (ch === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}
async function persistLocal() {
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("meta", "readwrite");
    tx.objectStore("meta").put({ records, year }, "book");
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => reject(tx.error);
  });
}
function scheduleDisk() {
  if (!folderReady || !folder) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { void writeDisk(); }, 700);
}
async function writeDisk() {
  if (!folder) return;
  const ok = await permit(folder);
  if (!ok) { folderReady = false; $("note").textContent = "Mất nối với " + DISK + ". Bấm Nối lại."; return; }
  const file = await folder.getFileHandle(FILE_NAME, { create: true });
  const writable = await file.createWritable();
  await writable.write(JSON.stringify({ year, updatedAt: new Date().toISOString(), records }, null, 2));
  await writable.close();
}
async function readDisk() {
  try {
    const file = await folder.getFileHandle(FILE_NAME);
    const text = await (await file.getFile()).text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.records)) return 0;
    const map = new Map(records.map((row) => [String(row.soDen), row]));
    let changed = 0;
    for (const row of data.records) {
      const soDen = String(row.soDen || "").trim();
      if (!soDen) continue;
      const prev = map.get(soDen);
      const next = { ...blank(), ...row, soDen, loai: canonLoai(row.loai) };
      if (!prev) { map.set(soDen, next); changed++; }
      else if (JSON.stringify(prev) !== JSON.stringify(next)) { map.set(soDen, { ...prev, ...next, soDen }); changed++; }
    }
    records = [...map.values()];
    return changed;
  } catch { return 0; }
}
function blank() {
  return { ngayNhan:"", soDen:"", noiGui:"", soKyHieu:"", ngayBanHanh:"", loai:"", trichYeu:"", nguoiNhan:"", kyNhan:"", ghiChu:"" };
}
async function permit(handle) {
  const mode = { mode: "readwrite" };
  if ((await handle.queryPermission(mode)) === "granted") return true;
  return (await handle.requestPermission(mode)) === "granted";
}
async function connectDisk() {
  if (!window.showDirectoryPicker) { alert("Hãy mở trang này bằng Chrome hoặc Edge trên máy tính."); return; }
  const handle = await showDirectoryPicker({ id: "sovanban-html", mode: "readwrite", startIn: folder || "desktop" });
  if (!(await permit(handle))) throw new Error("Chưa được phép ghi " + DISK);
  folder = handle;
  folderReady = true;
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "sovanban");
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => reject(tx.error);
  });
  const changed = await readDisk();
  await writeDisk();
  await persistLocal();
  $("note").textContent = `Đang nối liên tục với ${DISK}. ${changed ? "Đã gộp " + changed + " dòng từ ổ." : "Sổ tự ghi vào đây cho đến khi tắt máy."}`;
  render();
}
async function resumeDisk() {
  const db = await openDb();
  const handle = await new Promise((resolve) => {
    const tx = db.transaction("handles");
    const req = tx.objectStore("handles").get("sovanban");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
  db.close();
  if (!handle) return;
  folder = handle;
  if ((await handle.queryPermission({ mode: "readwrite" })) !== "granted") {
    $("note").textContent = "Bấm Nối D:\\Sovanban để xin lại quyền ghi. Máy còn bật thì giữ kết nối.";
    return;
  }
  folderReady = true;
  await readDisk();
  await writeDisk();
  $("note").textContent = "Đang nối liên tục với " + DISK + ". Chỉ ngắt khi tắt máy.";
  render();
}
function upsert(row) {
  const soDen = String(row.soDen || "").trim().replace(/\s+/g, "");
  if (!soDen) return;
  const next = { ...blank(), ...row, soDen, loai: canonLoai(row.loai), ngayNhan: toIso(row.ngayNhan), ngayBanHanh: toIso(row.ngayBanHanh) };
  const at = records.findIndex((item) => item.soDen === soDen);
  if (at >= 0) records[at] = { ...records[at], ...next };
  else records.push(next);
}
function openForm(row) {
  const form = $("form");
  $("dlgTitle").textContent = row ? "Sửa số đến " + row.soDen : "Thêm văn bản";
  for (const key of Object.keys(blank())) form.elements[key].value = row ? (row[key] || "") : "";
  $("dlg").showModal();
}

async function inflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buffer) {
  const view = new DataView(buffer);
  const files = {};
  let offset = 0;
  const decoder = new TextDecoder();
  while (offset + 30 < buffer.byteLength && view.getUint32(offset, true) === 0x04034b50) {
    const method = view.getUint16(offset + 8, true);
    const compSize = view.getUint32(offset + 18, true);
    const nameLen = view.getUint16(offset + 26, true);
    const extraLen = view.getUint16(offset + 28, true);
    const name = decoder.decode(new Uint8Array(buffer, offset + 30, nameLen));
    const start = offset + 30 + nameLen + extraLen;
    const comp = new Uint8Array(buffer, start, compSize);
    files[name] = method === 0 ? comp : method === 8 ? await inflate(comp) : new Uint8Array();
    offset = start + compSize;
  }
  return files;
}
function xmlText(node) {
  return [...node.childNodes].map((child) => child.nodeType === 3 ? child.nodeValue : xmlText(child)).join("");
}
function excelDate(serial) {
  const n = Number(serial);
  if (!Number.isFinite(n) || n < 20000 || n > 80000) return "";
  const utc = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
  return utc.toISOString().slice(0, 10);
}
async function importXlsx(file) {
  const files = await unzip(await file.arrayBuffer());
  const decoder = new TextDecoder();
  const shared = [];
  if (files["xl/sharedStrings.xml"]) {
    const doc = new DOMParser().parseFromString(decoder.decode(files["xl/sharedStrings.xml"]), "text/xml");
    for (const si of doc.getElementsByTagName("si")) shared.push(xmlText(si));
  }
  const sheetName = Object.keys(files).find((name) => /^xl\/worksheets\/sheet1\.xml$/.test(name));
  if (!sheetName) throw new Error("Không thấy sheet trong file Excel.");
  const doc = new DOMParser().parseFromString(decoder.decode(files[sheetName]), "text/xml");
  const grid = [];
  for (const cell of doc.getElementsByTagName("c")) {
    const ref = cell.getAttribute("r") || "A1";
    const col = ref.replace(/[0-9]/g, "").split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
    const row = Number(ref.replace(/[A-Z]/g, "")) - 1;
    const type = cell.getAttribute("t");
    const v = cell.getElementsByTagName("v")[0];
    let value = v ? v.textContent : xmlText(cell.getElementsByTagName("is")[0] || cell);
    if (type === "s") value = shared[Number(value)] || "";
    if (!grid[row]) grid[row] = [];
    grid[row][col] = value;
  }
  const header = (grid.find((row) => fold((row || []).join(" ")).includes("so den")) || []).map((cell) => fold(cell));
  const idx = (name) => header.findIndex((cell) => cell.includes(name));
  const cols = {
    ngayNhan: idx("ngay"),
    soDen: idx("so den"),
    noiGui: idx("noi gui"),
    soKyHieu: idx("van ban den"),
    ngayBanHanh: header.findIndex((cell, i) => cell.includes("ngay") && i !== idx("ngay") && cell.includes("van ban")),
    loai: idx("loai"),
    trichYeu: idx("trich"),
    nguoiNhan: idx("nhan van"),
    kyNhan: idx("ky nhan"),
    ghiChu: idx("ghi chu"),
  };
  if (cols.soDen < 0) throw new Error("File Excel cần có cột Số đến.");
  let added = 0;
  const start = grid.findIndex((row) => fold((row || []).join(" ")).includes("so den")) + 1;
  for (const line of grid.slice(start)) {
    if (!line) continue;
    const soDen = String(line[cols.soDen] ?? "").trim();
    if (!soDen) continue;
    const marker = String(line[cols.noiGui] ?? "").trim();
    if (/^\d+$/.test(soDen) && marker === String(Number(soDen) + 1)) continue;
    const row = {};
    for (const [key, at] of Object.entries(cols)) {
      if (at < 0) continue;
      let value = line[at] ?? "";
      if ((key === "ngayNhan" || key === "ngayBanHanh") && /^\d+(\.\d+)?$/.test(String(value))) value = excelDate(value) || value;
      row[key] = value;
    }
    const before = records.length;
    upsert(row);
    if (records.length !== before) added++;
  }
  return added;
}
function shiftDay(iso, delta) {
  const parts = String(iso || "").split("-").map(Number);
  const date = new Date(parts[0] || 2026, (parts[1] || 1) - 1, parts[2] || 1);
  date.setDate(date.getDate() + delta);
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return date.getFullYear() + "-" + mm + "-" + dd;
}
function exportExcel(day) {
  const headers = ["NGÀY","SỐ ĐẾN","NƠI GỬI VĂN BẢN","VĂN BẢN ĐẾN","NGÀY VĂN BẢN","LOẠI VĂN BẢN","TRÍCH YẾU NỘI DUNG CỦA VĂN BẢN","NHẬN VĂN BẢN","KÝ NHẬN","GHI CHÚ"];
  const keys = ["ngayNhan","soDen","noiGui","soKyHieu","ngayBanHanh","loai","trichYeu","nguoiNhan","kyNhan","ghiChu"];
  const cell = (value) => `<Cell><Data ss:Type="String">${esc(value)}</Data></Cell>`;
  const chosen = [...records].filter((row) => !day || row.ngayNhan === day).sort(compareRows);
  if (!chosen.length) { alert(day ? "Ngày này chưa có văn bản." : "Sổ chưa có dữ liệu để xuất."); return; }
  const body = chosen.map((row) => `<Row>${keys.map((key) => cell(key.startsWith("ngay") ? showDate(row[key]) : row[key])).join("")}</Row>`).join("");
  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Worksheet ss:Name="So den"><Table>
<Row>${headers.map(cell).join("")}</Row>
${body}
</Table></Worksheet></Workbook>`;
  const blob = new Blob([xml], { type: "application/vnd.ms-excel" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "So-van-ban-" + (day || ("toan-bo-" + year)) + ".xls";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("q").addEventListener("input", () => { page = 1; render(); });
$("day").addEventListener("change", () => { page = 1; render(); });
$("page").addEventListener("change", () => { page = Number($("page").value); render(); });
$("prev").addEventListener("click", () => { page = Math.max(1, page - 1); render(); });
$("next").addEventListener("click", () => { page += 1; render(); });
$("btnAdd").addEventListener("click", () => openForm(null));
$("btnOut").addEventListener("click", () => exportExcel(""));
$("btnOutDay").addEventListener("click", () => exportExcel($("outDay").value));
$("btnOutPrev").addEventListener("click", () => {
  const day = shiftDay($("outDay").value, -1);
  $("outDay").value = day;
  exportExcel(day);
});
$("btnExcel").addEventListener("click", () => $("file").click());
$("btnDisk").addEventListener("click", () => connectDisk().catch((error) => {
  if (error && error.name === "AbortError") return;
  alert(error.message || "Không nối được ổ.");
}));
$("rows").addEventListener("click", (event) => {
  const soDen = event.target.getAttribute("data-edit");
  if (!soDen) return;
  openForm(records.find((row) => row.soDen === soDen));
});
$("form").addEventListener("submit", (event) => {
  if (event.submitter && event.submitter.value !== "ok") return;
  const data = Object.fromEntries(new FormData(event.target).entries());
  upsert(data);
  page = 1;
  render();
  void persistLocal();
  scheduleDisk();
});
$("file").addEventListener("change", async (event) => {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    const added = await importXlsx(file);
    page = 1;
    render();
    await persistLocal();
    scheduleDisk();
    $("note").textContent = `Đã cập nhật từ Excel. Thêm mới ${added} số đến. Dòng trùng số đến được sửa theo file.`;
  } catch (error) {
    alert(error.message || "Không đọc được Excel.");
  }
});
window.addEventListener("pagehide", () => { if (folderReady) void writeDisk(); });
setInterval(() => { if (folderReady) void readDisk().then((n) => { if (n) { render(); void persistLocal(); } }); }, 8000);

(async function init() {
  const now = new Date();
  $("outDay").value = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  const db = await openDb();
  const saved = await new Promise((resolve) => {
    const tx = db.transaction("meta");
    const req = tx.objectStore("meta").get("book");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
  db.close();
  if (saved && Array.isArray(saved.records) && saved.records.length) {
    records = saved.records;
    year = saved.year || year;
  } else {
    records = fromSeed(SEED.rows || []);
    await persistLocal();
  }
  render();
  await resumeDisk();
  render();
})();
</script>
